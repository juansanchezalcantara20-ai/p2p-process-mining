[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pmining"
version = "1.0.0"
description = "Process mining on the BPI Challenge 2019 purchase-to-pay event log: data quality, AS-IS discovery, bottlenecks, conformance, root cause and a quantified TO-BE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Luis Sánchez Alcántara" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pm4py>=2.7.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
p2pmining = "p2pmining.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Markdown report templates contain long table rows by nature.
"src/p2pmining/report.py" = ["E501"]
