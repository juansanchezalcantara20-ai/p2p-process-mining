name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz (process-map rendering)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install package
        run: pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Pipeline smoke run on the versioned 1% sample
        run: python -m p2pmining.pipeline --source sample
      - name: Build report site (strict)
        run: mkdocs build --strict
