site_name: "Purchase-to-pay process mining · BPI Challenge 2019"
site_description: "From event data to a quantified TO-BE: data quality, AS-IS discovery, bottlenecks, conformance, root cause and DMAIC."
site_author: "Juan Luis Sánchez Alcántara"
repo_url: https://github.com/juansanchezalcantara20-ai/p2p-process-mining
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: blue
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: blue grey
      accent: blue
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
nav:
  - "Committee summary": index.md
  - "1 · Data quality": 01-data-quality.md
  - "2 · AS-IS discovery": 02-discovery.md
  - "3 · Performance": 03-performance.md
  - "4 · Compliance": 04-conformance.md
  - "5 · Root cause": 05-root-cause.md
  - "6 · TO-BE & improvement case": 06-to-be.md
  - "7 · DMAIC & control": 07-dmaic.md
  - "Decision log": DECISIONS.md
